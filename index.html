<style>
/* Layout: one-screen arcade station — HUD strip, canvas (crowd plaza with swirling circle → platform bays → parking lot), booster bar */
:root{
  --night:#121722;      /* page ground */
  --paint:#ffd23f;      /* road-paint yellow accent */
  --chalk:#eef1f7;      /* text */
  --muted:#8c96ad;      /* secondary text */
  --panel:#1c2231;      /* bars and cards */
  --danger:#ff4d5e;
  --display:"Bungee","Arial Black",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--body);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));box-sizing:border-box}
.hud{display:flex;align-items:center;gap:8px;padding-block:10px 4px}
.brand{font-family:var(--display);font-size:17px;line-height:1;letter-spacing:.02em;color:var(--paint);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 #7a5c00}
.brand span{color:var(--chalk);text-shadow:0 2px 0 #3a4256}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 11px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.pill small{color:var(--muted);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.coin::before{content:"";width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,var(--paint) 45%,#c99a00);box-shadow:0 1px 0 #7a5c00}
.timer b{min-width:3.2ch;text-align:right}
.timer.low{background:#3a1820}
.timer.low b{color:var(--danger)}
.icon-btn{background:var(--panel);border:0;color:var(--chalk);border-radius:999px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;flex:none;padding:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .slash{display:none}
.icon-btn.off{color:var(--muted)}
.icon-btn.off .slash{display:block}
canvas{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding-block:6px 12px}
.bar button{background:linear-gradient(#232a3b,#1a2030);color:var(--chalk);border:2px solid transparent;border-radius:14px;padding:9px 4px;font:700 12.5px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s;min-width:0;box-shadow:0 3px 0 #0b0e15}
.bar button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0e15}
.bar button small{color:var(--paint);font-weight:700;font-size:11px;font-variant-numeric:tabular-nums}
.bar button.armed{border-color:var(--paint);background:#2f2a14}
.bar button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--paint);outline-offset:2px}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,10,16,.7);backdrop-filter:blur(4px);padding:20px;z-index:5}
.card{background:linear-gradient(#232a3b,#1a2030);border-radius:24px;padding:24px 22px;max-width:340px;width:100%;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.card h1{font-family:var(--display);font-weight:400;font-size:29px;line-height:1.05;margin:0;color:var(--paint);text-wrap:balance;text-shadow:0 3px 0 #7a5c00}
.card .tag{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:-8px}
.card p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
.card p b{color:var(--chalk)}
.card ol{margin:0;padding-left:20px;text-align:left;color:var(--chalk);font-size:14px;line-height:1.55;display:grid;gap:4px}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card canvas{width:280px;max-width:100%;height:90px;align-self:center;flex:none}
.big{background:linear-gradient(#ffe066,var(--paint));color:#1b1500;border:0;border-radius:14px;padding:13px 22px;font:400 17px var(--display);cursor:pointer;box-shadow:0 4px 0 #a07a00}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #a07a00}
.ghost{background:transparent;color:var(--chalk);border:2px solid #3a4359;border-radius:14px;padding:11px 16px;font:700 14px var(--body);cursor:pointer}
@media (max-width:420px){.hud.rush .brand{display:none}.hud.rush{justify-content:flex-end}}
@media (prefers-reduced-motion:reduce){.bar button{transition:none}}
</style>

<body>
<div class="app">
  <div class="hud" id="hud">
    <div class="brand">PERON <span>PANIKA</span></div>
    <div class="pill timer" id="tmP" hidden><small>Špica</small><b id="tm">0:00</b></div>
    <div class="pill"><small>Nivo</small><b id="lv">1</b></div>
    <div class="pill coin"><b id="coins">120</b></div>
    <button class="icon-btn" id="snd" aria-label="Zvučni efekti">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="slash" d="M3 3l18 18"/></svg>
    </button>
    <button class="icon-btn" id="mus" aria-label="Muzika">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/><path class="slash" d="M3 3l18 18"/></svg>
    </button>
  </div>
  <canvas id="cv" aria-label="Stanica: krug s putnicima, peroni i parking s autobusima"></canvas>
  <div class="bar">
    <button id="bCrane">Dizalica<small>40</small></button>
    <button id="bSort">Dozovi<small>30</small></button>
    <button id="bBay">+1 peron<small>80</small></button>
    <button id="bRetry">Ponovo<small>nivo</small></button>
  </div>
</div>
<div class="ov" id="ov"></div>

<script>
const cv=document.getElementById('cv');let ctx=cv.getContext('2d');
const bgC=document.createElement('canvas');
const PAL=['#ff4d5e','#ffb020','#2ec27e','#3d8bff','#b45cff','#ff7ac6','#21d4e0'];
const PAIR=['#ffd23f','#e3e7ef'],HIDDEN='#5b6378';
const DIRS={R:[1,0,0],L:[-1,0,Math.PI],D:[0,1,Math.PI/2],U:[0,-1,-Math.PI/2]};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let POOL=30;

let save={level:1,coins:120,sfxOff:false,musOff:false,seen:{}};
try{const s=JSON.parse(localStorage.getItem('peronpanika')||'null');if(s){save=Object.assign(save,s);if(s.muted&&s.sfxOff===undefined)save.sfxOff=true;save.seen=save.seen||{}}}catch(e){}
function persist(){try{localStorage.setItem('peronpanika',JSON.stringify(save))}catch(e){}}

let W=380,H=700,cell=40,lotX=0,lotY=0,cols=6,rows=7,CX=190,CY=100,RAD=84,baysTop=200,baysY=248,lotTop=310;
const bayH=96;
let buses=[],queue=[],pool=[],bays=[],flights=[],parts=[],floats=[],cones=[];
let state='menu',combo=0,comboT=0,craneArmed=false,bayBought=false,bayShake=0,totalPax=0,entryT=0,boardSndT=0,shakeT=0,gateT=0;
let rush=false,rushT=0,lastTick=null,usedBoost=false,pid=0;

// ================= AUDIO =================
const A={ctx:null};
function ac(){
  if(A.ctx)return A.ctx;
  try{
    const C=new (window.AudioContext||window.webkitAudioContext)();
    const comp=C.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;comp.connect(C.destination);
    A.master=C.createGain();A.master.gain.value=.9;A.master.connect(comp);
    A.sfx=C.createGain();A.sfx.connect(A.master);
    A.mus=C.createGain();A.mus.gain.value=0;A.mus.connect(A.master);
    A.pad=C.createGain();A.pad.connect(A.mus);
    A.dl=C.createDelay(1);A.dl.delayTime.value=60/122*.75;const fb=C.createGain();fb.gain.value=.32;const lp=C.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3000;
    const wet=C.createGain();wet.gain.value=.28;A.dl.connect(lp);lp.connect(fb);fb.connect(A.dl);lp.connect(wet);wet.connect(A.master);
    const len=C.sampleRate,buf=C.createBuffer(1,len,C.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.noise=buf;
    A.ctx=C;
  }catch(e){return null}
  return A.ctx;
}
function audioUnlock(){const C=ac();if(C&&C.state==='suspended')C.resume()}
function osc(o){
  const C=A.ctx;if(!C)return;const{f=440,to=null,type='sine',t=0,d=.1,v=.2,attack=.004,out=A.sfx,send=0,detune=0,filt=null,sus=false}=o;
  const t0=C.currentTime+Math.max(0,t),n=C.createOscillator(),g=C.createGain();
  n.type=type;n.frequency.setValueAtTime(f,t0);if(to)n.frequency.exponentialRampToValueAtTime(to,t0+d);n.detune.value=detune;
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+attack);if(sus)g.gain.setValueAtTime(v,t0+d*.75);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  let node=n;if(filt){const fl=C.createBiquadFilter();fl.type=filt.type;fl.frequency.setValueAtTime(filt.f,t0);fl.Q.value=filt.q||1;if(filt.to)fl.frequency.exponentialRampToValueAtTime(filt.to,t0+(filt.td||d));n.connect(fl);node=fl}
  node.connect(g);g.connect(out);if(send){const s=C.createGain();s.gain.value=send;g.connect(s);s.connect(A.dl)}
  n.start(t0);n.stop(t0+d+.05);
}
function noise(o){
  const C=A.ctx;if(!C)return;const{t=0,d=.2,v=.2,type='lowpass',f=1000,to=null,q=1,out=A.sfx,attack=.004,send=0}=o;
  const t0=C.currentTime+Math.max(0,t),s=C.createBufferSource(),fl=C.createBiquadFilter(),g=C.createGain();
  s.buffer=A.noise;s.loop=true;fl.type=type;fl.frequency.setValueAtTime(f,t0);fl.Q.value=q;if(to)fl.frequency.exponentialRampToValueAtTime(to,t0+d);
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+attack);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(fl);fl.connect(g);g.connect(out);if(send){const x=C.createGain();x.gain.value=send;g.connect(x);x.connect(A.dl)}
  s.start(t0,Math.random()*.5);s.stop(t0+d+.05);
}
function mf(m){return 440*Math.pow(2,(m-69)/12)}
const PENTA=[0,2,4,7,9];
const S=fn=>(...a)=>{if(save.sfxOff||!ac())return;try{fn(...a)}catch(e){}};
const sfx={
  ui:S(()=>{osc({f:740,d:.06,v:.07,type:'triangle'});osc({f:1110,t:.04,d:.07,v:.05,type:'triangle'})}),
  tap:S(()=>{osc({f:65,to:150,d:.32,v:.1,type:'sawtooth',filt:{type:'lowpass',f:500,to:1400}});noise({d:.22,v:.07,type:'bandpass',f:700,to:2600,q:1.4});osc({f:520,to:900,d:.07,v:.06,type:'triangle'})}),
  bump:S(()=>{osc({f:170,to:45,d:.2,v:.38});noise({d:.09,v:.22,type:'lowpass',f:600});osc({f:95,d:.07,v:.05,type:'square'})}),
  locked:S(()=>{[0,.05,.11,.18].forEach((t,i)=>noise({t,d:.045,v:.14-i*.02,type:'bandpass',f:3600+i*500,q:7}));osc({f:240,to:170,d:.14,v:.05,type:'square',filt:{type:'lowpass',f:1200}})}),
  iceTap:S(()=>{osc({f:2400,d:.09,v:.06,send:.4});osc({f:3300,t:.03,d:.07,v:.04,send:.4});noise({d:.05,v:.06,type:'highpass',f:5000})}),
  crack:S(()=>{for(let i=0;i<6;i++)noise({t:i*.028+Math.random()*.01,d:.05,v:.22,type:'bandpass',f:1800+Math.random()*2400,q:3});osc({f:1700,to:380,d:.24,v:.06,send:.3});osc({f:2600,t:.1,d:.3,v:.04,send:.6})}),
  unlock:S(()=>{noise({d:.03,v:.12,type:'highpass',f:6000});osc({f:1450,d:.06,v:.12,type:'triangle'});osc({f:2180,t:.07,d:.28,v:.11,type:'triangle',send:.5});osc({f:2900,t:.12,d:.22,v:.05,send:.5})}),
  reveal:S(()=>{osc({f:480,to:1500,d:.22,v:.09,send:.4});osc({f:1500,t:.2,d:.22,v:.07,type:'triangle',send:.5});osc({f:1890,t:.26,d:.2,v:.05,type:'triangle',send:.5})}),
  board:S(c=>{const i=(c-1)%15,semi=PENTA[i%5]+12*Math.floor(i/5),f=392*Math.pow(2,semi/12);
    osc({f,d:.12,v:.1,type:'triangle',send:.2});osc({f:f*2,d:.05,v:.03});noise({d:.02,v:.025,type:'highpass',f:6000})}),
  park:S(()=>{osc({f:95,to:60,d:.12,v:.14});noise({t:.05,d:.32,v:.13,type:'highpass',f:1600,to:4200,attack:.015})}),
  depart:S(()=>{const h={type:'square',d:.2,v:.045,filt:{type:'lowpass',f:1700}};osc({...h,f:349});osc({...h,f:440});osc({...h,f:349,t:.24,d:.32});osc({...h,f:440,t:.24,d:.32});
    osc({f:55,to:120,d:.7,v:.08,type:'sawtooth',filt:{type:'lowpass',f:380}});osc({f:988,t:.12,d:.07,v:.05,type:'square',filt:{type:'lowpass',f:4000}});osc({f:1319,t:.19,d:.28,v:.05,type:'square',send:.35,filt:{type:'lowpass',f:4000}})}),
  crane:S(()=>{osc({f:50,d:.75,v:.08,type:'sawtooth',filt:{type:'lowpass',f:320}});osc({f:280,to:900,d:.65,v:.05,type:'triangle'});for(let i=0;i<7;i++)noise({t:i*.08,d:.04,v:.06,type:'bandpass',f:4200,q:6})}),
  whoosh:S(()=>{noise({d:.38,v:.12,type:'bandpass',f:300,to:2400,q:1.6});osc({f:220,to:660,d:.3,v:.05,type:'triangle',send:.3})}),
  sort:S(()=>{osc({f:1200,to:900,d:.12,v:.06,type:'square',filt:{type:'lowpass',f:3000}});osc({f:1200,to:900,t:.14,d:.12,v:.06,type:'square',filt:{type:'lowpass',f:3000}});noise({t:.05,d:.5,v:.06,type:'bandpass',f:500,to:1500,q:.7})}),
  build:S(()=>{[0,.08,.16].forEach((t,i)=>osc({f:200+i*110,t,d:.06,v:.07,type:'square',filt:{type:'lowpass',f:1600}}));noise({t:.22,d:.25,v:.1,type:'highpass',f:2000})}),
  tick:S(hot=>{osc({f:hot?2100:1700,d:.035,v:hot?.09:.05,type:'square',filt:{type:'lowpass',f:5000}})}),
  full:S(()=>{osc({f:150,to:60,d:.22,v:.3});noise({d:.14,v:.18,type:'lowpass',f:900});osc({f:220,t:.05,d:.2,v:.06,type:'square',filt:{type:'lowpass',f:900}})}),
  win:S(()=>{[69,72,76,81,84].forEach((m,i)=>osc({f:mf(m),t:i*.08,d:.32,v:.11,type:'triangle',send:.45}));
    [69,72,76,81].forEach(m=>osc({f:mf(m),t:.48,d:1.2,v:.05,attack:.03,send:.3}));osc({f:mf(88),t:.48,d:.9,v:.03,type:'triangle',send:.6});noise({t:.45,d:.6,v:.05,type:'highpass',f:8000})}),
  lose:S(()=>{[67,66,65].forEach((m,i)=>osc({f:mf(m),t:i*.24,d:.26,v:.07,type:'sawtooth',filt:{type:'lowpass',f:1300}}));osc({f:mf(64),to:mf(58),t:.72,d:.8,v:.07,type:'sawtooth',filt:{type:'lowpass',f:1100}})})
};

// ================= MUSIC =================
// 32-bar song in A minor: groove (A) → chorus (B) → breakdown → drop. 16 steps per bar.
const CHD={Am:[45,[57,60,64]],F:[41,[57,60,65]],C:[48,[55,60,64]],G:[43,[55,59,62]],Em:[40,[55,59,64]]};
const PROG_A=['Am','F','C','G'],PROG_B=['F','G','Em','Am'];
function phrase(list){const m={};list.forEach(([s,n,l])=>m[s]=[n,l]);return m}
const MEL_A=phrase([[0,76,2],[2,74,1],[3,72,3],[6,69,2],[8,72,2],[10,74,2],[12,76,4],[16,77,2],[18,76,1],[19,74,3],[22,72,2],[24,69,4],[28,72,4],
  [32,76,2],[34,79,2],[36,76,2],[38,72,2],[40,74,3],[43,76,3],[46,72,2],[48,74,4],[52,71,2],[54,67,2],[56,71,2],[58,74,2],[60,79,4]]);
const MEL_B=phrase([[0,81,3],[3,79,1],[4,77,2],[6,76,2],[8,77,2],[10,79,2],[12,81,2],[14,84,2],[16,83,4],[20,79,2],[22,74,2],[24,79,3],[27,81,1],[28,79,4],
  [32,79,2],[34,76,2],[36,71,2],[38,76,2],[40,79,3],[43,83,1],[44,81,2],[46,79,2],[48,76,6],[54,72,2],[56,76,2],[58,79,2],[60,81,4]]);
function section(bar){if(bar<8)return'A';if(bar<16)return'B';if(bar<20)return'BRK';return'DROP'}
const M={timer:null,next:0,step:0,started:false};
function spb(){return 60/(rush?138:122)/4}
function kick(t,v=.6){const o=A.mus;osc({f:165,to:42,d:.26,v,t,out:o});noise({t,d:.015,v:.1,type:'highpass',f:3000,out:o});
  if(A.pad){const t0=A.ctx.currentTime+Math.max(0,t);A.pad.gain.cancelScheduledValues(t0);A.pad.gain.setValueAtTime(.25,t0);A.pad.gain.linearRampToValueAtTime(1,t0+.2)}}
function clap(t,v=1){const o=A.mus;[0,.012,.024].forEach(x=>noise({t:t+x,d:.02,v:.12*v,type:'bandpass',f:1500,q:.9,out:o}));noise({t:t+.03,d:.16,v:.13*v,type:'bandpass',f:1700,q:.7,out:o,send:.15})}
function hat(t,v,open){noise({t,d:open?.2:.03,v,type:'highpass',f:open?6500:7800,out:A.mus})}
function lead(m,t,len,v=.05,bright=2800){const d=len*spb()*.95+.05,o=A.mus;
  osc({f:mf(m),type:'sawtooth',d,v,t,out:o,detune:-8,send:.35,sus:true,attack:.01,filt:{type:'lowpass',f:bright*1.6,to:bright*.6,td:d}});
  osc({f:mf(m),type:'sawtooth',d,v,t,out:o,detune:8,sus:true,attack:.01,filt:{type:'lowpass',f:bright*1.6,to:bright*.6,td:d}});
  osc({f:mf(m-12),type:'square',d,v:v*.35,t,out:o,sus:true,filt:{type:'lowpass',f:1200}})}
function bell(m,t,len){const d=len*spb()+.3;osc({f:mf(m),type:'triangle',d,v:.05,t,out:A.mus,send:.5});osc({f:mf(m)*2,d:d*.6,v:.02,t,out:A.mus,send:.5})}
function bass(m,t,len,v=.22){const d=len*spb()*.9+.02,o=A.mus;
  osc({f:mf(m),type:'sawtooth',d,v:v*.5,t,out:o,filt:{type:'lowpass',f:1400,to:180,q:6,td:d}});osc({f:mf(m),type:'triangle',d,v,t,out:o})}
function playStep(s,t){
  const bar=Math.floor(s/16),st=s%16,sec=section(bar),prog=(sec==='B'||(sec==='DROP'&&bar<28))?PROG_B:PROG_A,[root,tri]=CHD[prog[bar%4]];

  if(sec==='A'){if(st===0||st===10||(st===7&&bar%2))kick(t,.55);if(st===4||st===12)clap(t,.8);if(st%2===0)hat(t,st%4===2?.06:.03)}
  if(sec==='B'||sec==='DROP'){if(st%4===0||(sec==='DROP'&&st===14))kick(t);if(st===4||st===12)clap(t);hat(t,st%4===2?.07:.028);if(sec==='DROP'&&st%4===2)hat(t,.05,true)}

    for(const [ps,off,l] of pat)if(ps===st)bass(root+off,t,l)}

  if((sec==='BRK'||sec==='DROP')&&st===0)tri.forEach(n=>[-7,7].forEach(dt=>osc({f:mf(n),type:'sawtooth',d:16*spb(),v:.016,t,out:A.pad,detune:dt,attack:.25,sus:true,filt:{type:'lowpass',f:1100}})));

  if(sec==='A'&&bar>=4){const m=MEL_A[ph];if(m)lead(m[0],t,m[1],.04,2000)}
  if(sec==='B'){const m=MEL_B[ph];if(m)lead(m[0],t,m[1],.042)}

}

// ================= LEVELS =================
// Buses are placed so each new bus has a clear path past the earlier ones; reverse placement order is always a valid exit order.
// Keys sit on a bus that exits earlier than its lock; ice counts never exceed the buses that exit earlier. Every queue is checked by the solver.
function genLevel(n){
  cols=Math.min(6+Math.floor(n/4),8);rows=Math.min(7+Math.floor(n/3),10);
  const nC=Math.min(3+Math.floor((n-1)/2),7);
  const target=Math.min(5+Math.round(n*1.5),Math.floor(cols*rows/2.7));
  const nCones=n>=3?Math.min(1+Math.floor((n-3)/3),4):0;
  let placed=[],cn=[];

    placed=[];cn=[];const g=new Array(cols*rows).fill(0);let tries=0;
    while(cn.length<nCones){const x=ri(0,cols-1),y=ri(0,rows-1);if(!g[y*cols+x]){g[y*cols+x]=2;cn.push([x,y])}}
    while(placed.length<target&&tries<4000){tries++;
      const len=(n>2&&Math.random()<.18)?4:(Math.random()<.45?3:2);
      const dir='URDL'[ri(0,3)],h=dir==='L'||dir==='R';
      if((h?cols:rows)<len+1)continue;
      const b={x:ri(0,h?cols-len:cols-1),y:ri(0,h?rows-1:rows-len),len,dir};
      const cs=cellsOf(b);if(cs.some(([x,y])=>g[y*cols+x]))continue;
      let [fx,fy]=frontOf(b);const [dx,dy]=DIRS[dir];let ok=true;
      fx+=dx;fy+=dy;while(fx>=0&&fy>=0&&fx<cols&&fy<rows){if(g[fy*cols+fx]){ok=false;break}fx+=dx;fy+=dy}
      if(!ok)continue;
      cs.forEach(([x,y])=>g[y*cols+x]=1);placed.push(b);
    }
    if(placed.length>=Math.min(target,5))break;
  }
  cones=cn;
  const pal=PAL.slice().sort(()=>Math.random()-.5).slice(0,nC);
  let ci=ri(0,nC-1);
  buses=placed.map((b,i)=>Object.assign(b,{id:i,color:pal[(ci++)%nC],cap:b.len*4,filled:0,pending:0,state:'lot',nudge:0,nt:null,sh:0,bay:-1,
    hidden:false,lockBy:null,key:null,pair:0,ice:0,pop:0,sq:0,bt:0,puffT:0}));
  const N=buses.length;
  const nLock=n>=4?(n>=9?2:1):0;let pair=0;
  for(let k=0;k<nLock;k++){
    const cand=buses.filter(b=>b.id<N-1&&b.lockBy==null&&b.key==null);
    if(!cand.length)break;

    if(!keys.length)continue;

  const chunks=[];placed.slice().reverse().forEach(b=>{let left=b.cap;while(left>0){const s=Math.min(left,ri(4,8));chunks.push({c:b.color,n:s});left-=s}});

// The first half of the colour groups waits in the left queue, the rest in the right one; the circle empties the left queue first.
function interleave(chunks){
  const total=chunks.reduce((a,c)=>a+c.n,0),out=[];let acc=0;
  chunks.forEach(ch=>{const side=acc<total/2?0:1;acc+=ch.n;for(let k=0;k<ch.n;k++)out.push({c:ch.c,side})});
  return out;

// Depth-first search over which bus to pull next, with the crowd circle holding P people. true = a win exists, false = none, null = budget ran out.
function solvable(SLOTS,P,budget){
  const Q=queue.map(e=>e.c),seen=new Set();let nodes=0;

    let ch=true,size=0;for(const k in pl)size+=pl[k];
    while(ch){ch=false;
      while(qi<Q.length&&size<P){pl[Q[qi]]=(pl[Q[qi]]||0)+1;qi++;size++;ch=true}
      for(let k=bay.length-1;k>=0;k--){const b=buses[bay[k][0]],have=pl[b.color]||0;
        if(have>0){const t=Math.min(have,b.cap-bay[k][1]);pl[b.color]-=t;size-=t;bay[k][1]+=t;ch=true;if(bay[k][1]>=b.cap)bay.splice(k,1)}}
    }

  }
  function rec(gone,bay,pl,qi){
    if(++nodes>budget)return null;
    bay=bay.map(x=>x.slice());pl=Object.assign({},pl);
    let size;[qi,size]=settle(bay,pl,qi);
    if(qi>=Q.length&&size===0)return true;
    if(bay.length>=SLOTS)return false;
    const key=gone.join('')+'|'+bay.map(x=>x.join(':')).sort().join(',')+'|'+qi;if(seen.has(key))return false;seen.add(key);
    let gc=0;buses.forEach((b,i)=>{b.state=gone[i]?'gone':'lot';gc+=gone[i]});
    const mov=buses.filter(b=>b.state==='lot'&&b.ice<=gc&&(b.lockBy==null||buses[b.lockBy].state!=='lot')&&freeDist(b).clear);
    const score=b=>-(pl[b.color]||0)*4+Math.max(0,Q.indexOf(b.color,qi)-qi);
    mov.sort((a,b)=>score(a)-score(b));
    for(const b of mov){const g=gone.slice();g[b.id]=1;const r=rec(g,[...bay,[b.id,0]],pl,qi);if(r)return true;if(r===null)return null}
    return false;

function occ(){const g=new Array(cols*rows).fill(null);cones.forEach(([x,y])=>g[y*cols+x]='cone');buses.forEach(b=>{if(b.state==='lot')cellsOf(b).forEach(([x,y])=>g[y*cols+x]=b)});return g}

  x+=dx;y+=dy;while(x>=0&&y>=0&&x<cols&&y<rows){if(g[y*cols+x])return{clear:false,d,hit:g[y*cols+x]};d++;x+=dx;y+=dy}return{clear:true,d}}

function leaveLot(b){
  b.hidden=false;

    if(o.ice>0){o.ice--;o.sh=.2;if(o.ice===0){sfx.crack();shards(o);o.pop=1}else sfx.iceTap()}
    if(o.lockBy===b.id){o.lockBy=null;o.pop=1;sfx.unlock();const c=lotCenter(o);floatText(c.x,c.y-12,'Otključan!',PAIR[o.pair]);sparks(c.x,c.y,PAIR[o.pair],10)}

}
function refreshReveal(snd){let any=false;for(const b of buses){if(b.state==='lot'&&b.hidden&&freeDist(b).clear){b.hidden=false;b.pop=1;any=true;const c=lotCenter(b);sparks(c.x,c.y,b.color,8)}}if(any&&snd)sfx.reveal()}

function startFly(b,x,y,a,sz,crane){Object.assign(b,{state:'fly',fx:x,fy:y,fa:a,fL:sz.L,fW:sz.Wd,ft:0,fd:crane?.7:.45,crane:!!crane})}

// ================= CROWD =================
// Each side is a snaking queue (three lanes). People walk through the side doors into the circle,
// circle around the fountain in one or two walking lanes, and leave only through the gate at the bottom.
const SP=16,WALK=95,PS=1.15,GATE=Math.PI/2,TAU=Math.PI*2,RING_V=42;
let QP=[null,null],slots=[],lanes=1,ringT=0,doorT=[0,0],boostT=0,ringMul=1;
function laneR(l){return lanes===1?RAD*.68:(l?RAD*.52:RAD*.8)}
function makeSlots(){lanes=POOL>16?2:1;slots=[];
  for(let l=0;l<lanes;l++){const n=l===0?Math.ceil(POOL/lanes):Math.floor(POOL/lanes);for(let i=0;i<n;i++)slots.push({lane:l,ph:i/n*TAU+l*.4,occ:null})}}
function buildPaths(){
  for(const side of [0,1]){const s=side?1:-1,X=dx=>CX+s*dx,yb=CY+32,ym=CY+10,yt=CY-12,xo=W/2-12;
    const pts=[[X(RAD+2),ym],[X(RAD+16),yb],[X(xo),yb],[X(xo),ym],[X(RAD+26),ym],[X(RAD+26),yt],[X(W/2+3000),yt]];
    const seg=[];for(let i=1;i<pts.length;i++)seg.push(Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    QP[side]={pts,seg}}
}
function polyAt(pts,seg,d){let i=0;d=Math.max(0,d);while(i<seg.length-1&&d>seg[i]){d-=seg[i];i++}
  const a=pts[i],b=pts[i+1],k=Math.min(1.0001,d/seg[i]||0);return{x:a[0]+(b[0]-a[0])*k,y:a[1]+(b[1]-a[1])*k}}
function pathAt(side,d){const q=QP[side];return polyAt(q.pts,q.seg,d)}
function gatePos(){return{x:CX,y:CY+RAD+10}}
function angCross(a0,a1,t){return Math.floor((a0-t)/TAU)!==Math.floor((a1-t)/TAU)}
function updateCrowd(dt){
  doorT[0]=Math.max(0,doorT[0]-dt);doorT[1]=Math.max(0,doorT[1]-dt);
  const k=[0,0];
  for(const p of queue){const sd=p.side,tgt=(k[sd]++)*SP;
    if(!p.init){p.init=true;p.d=tgt+180+Math.random()*60}
    const diff=tgt-p.d,st=WALK*dt,step=diff*Math.min(1,dt*5);p.d+=Math.max(-st,Math.min(st,step));
    const pt=pathAt(sd,p.d);p.x=pt.x;p.y=pt.y}
  boostT=Math.max(0,boostT-dt);ringMul+=((boostT>0?2.6:1)-ringMul)*Math.min(1,dt*4);
  const T0=ringT;ringT+=dt*ringMul;const open=state==='play'||state==='win';
  for(const s of slots){const r=laneR(s.lane),w=RING_V/r,a0=s.ph+w*T0,a1=s.ph+w*ringT,x=CX+Math.cos(a1)*r,y=CY+Math.sin(a1)*r+6,p=s.occ;
    if(p){
      if(p.t<1){p.t=Math.min(1,p.t+dt/.5);const e=ease(p.t);p.x=p.sx+(x-p.sx)*e;p.y=p.sy+(y-p.sy)*e}else{p.x=x;p.y=y}
      if(state!=='play'||p.t<1||!angCross(a0,a1,GATE))continue;
      let best=null;
      for(const b of bays)if(b&&b.state==='bay'&&b.leaveDelay==null&&b.color===p.c&&b.filled+b.pending<b.cap&&(!best||b.filled+b.pending>best.filled+best.pending))best=b;
      if(!best)continue;
      s.occ=null;pool.splice(pool.indexOf(p),1);best.pending++;gateT=.3;
      const bp=bayPos(best.bay),g=gatePos(),wy=baysTop+8,pts=[[p.x,p.y],[g.x,g.y],[g.x,wy],[bp.x,wy],[bp.x,baysTop+22]],seg=[];
      for(let i=1;i<pts.length;i++)seg.push(Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
      flights.push({c:p.c,v:p.v,ph:p.ph,bus:best,d:0,pts,seg,tot:seg.reduce((a,b)=>a+b,0),x:p.x,y:p.y});
    }else if(open&&queue.length&&pool.length<POOL){
      const h=queue[0];
      if(h.d<3&&angCross(a0,a1,h.side?0:Math.PI)){queue.shift();const np={c:h.c,v:h.v,ph:h.ph,x:h.x,y:h.y,sx:h.x,sy:h.y,t:0,slot:s};s.occ=np;pool.push(np);doorT[h.side]=.3}
    }
  }
}

// ================= UPDATE =================
function update(dt){
  bayShake=Math.max(0,bayShake-dt);shakeT=Math.max(0,shakeT-dt);boardSndT-=dt;gateT=Math.max(0,gateT-dt);
  updateCrowd(dt);
  for(const b of buses){
    b.pop=Math.max(0,b.pop-dt*3);b.sq=Math.max(0,b.sq-dt*2.5);
    if(b.state==='lot'){
      b.sh=Math.max(0,b.sh-dt);
      if(b.nt!==null){b.nt+=dt;const T1=.09,T2=.2;
        if(b.nt<T1)b.nudge=b.nmax*(b.nt/T1);else if(b.nt<T1+T2)b.nudge=b.nmax*(1-(b.nt-T1)/T2);else{b.nudge=0;b.nt=null}}
    }else if(b.state==='exit'){
      b.v=Math.min(b.v+dt*70,30);b.dist+=b.v*dt;
      const c=lotCenter(b),[dx,dy,a]=DIRS[b.dir],x=c.x+dx*b.dist*cell,y=c.y+dy*b.dist*cell,m=b.len*cell*.5;
      b.puffT-=dt;if(b.puffT<=0){b.puffT=.035;puff(x-dx*m,y-dy*m)}
      if(x<lotX-m||x>lotX+cols*cell+m||y<lotY-m||y>lotY+rows*cell+m)startFly(b,x,y,a,lotSize(b));
    }else if(b.state==='fly'){
      b.ft+=dt/b.fd;if(b.ft>=1){b.state='bay';b.sq=.5;sfx.park();const p=bayPos(b.bay);puff(p.x-12,p.y+30,null,true);puff(p.x+12,p.y+30,null,true)}
    }else if(b.state==='bay'){
      if(b.leaveDelay!=null){b.leaveDelay-=dt;if(b.leaveDelay<=0){b.leaveDelay=null;b.state='leave';b.lt=0;bays[b.bay]=null;
        save.coins+=1;updateHud();const p=bayPos(b.bay);floatText(p.x,baysTop+6,'+1','#ffd23f');sfx.depart();sparks(p.x,p.y,'#ffd23f',12)}}
    }else if(b.state==='leave'){b.lt+=dt;if(b.lt>.7)b.state='gone'}
  }
  comboT-=dt;if(comboT<=0){if(combo>=25)floatText(CX,CY-RAD-2,'Super ×'+combo,'#ffd23f',true);combo=0}
  for(let i=flights.length-1;i>=0;i--){const f=flights[i];f.d+=WALK*1.3*dt;const pt=polyAt(f.pts,f.seg,f.d);f.x=pt.x;f.y=pt.y;
    if(f.d>=f.tot){const b=f.bus;b.pending--;b.filled++;b.sq=.22;flights.splice(i,1);if(b.filled>=b.cap)b.leaveDelay=.25;
      combo++;comboT=.9;if(boardSndT<=0){sfx.board(combo);boardSndT=.045}}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vy+=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.r+=p.vr*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt*(floats[i].big?.7:1);if(floats[i].t>1)floats.splice(i,1)}
  if(state==='play')checkEnd();
  if(state==='play'&&rush){
    rushT-=dt;const s=Math.ceil(rushT);
    if(s!==lastTick&&s<=10&&s>0){lastTick=s;sfx.tick(s<=3);if(s<=3)buzz(15)}
    if(rushT<=0){rushT=0;loseLevel('time')}
    updateTimer();
  }
}
function canBoardAny(){return bays.some(b=>b&&b.state==='bay'&&b.leaveDelay==null&&b.filled+b.pending<b.cap&&pool.some(p=>p.c===b.color))}
function checkEnd(){
  const moving=buses.some(b=>b.state==='exit'||b.state==='fly'||b.leaveDelay!=null)||flights.length||pool.some(p=>p.t<1);
  if(!queue.length&&!pool.length&&!flights.length&&buses.every(b=>b.state==='gone'||b.state==='leave')){
    if(buses.every(b=>b.state==='gone'))winLevel();return}
  if(moving)return;
  if(queue.length&&pool.length<POOL)return;
  if(bays.every(b=>b)&&!canBoardAny())loseLevel('full');
}

function drawDoor(cx,cy,hor,open,lamp){
  const o=Math.max(0,Math.min(1,open)),dw=12*(1-o*.85);ctx.save();ctx.translate(cx,cy);if(!hor)ctx.rotate(Math.PI/2);

function drawBus(b,x,y,ang,L,Wd,alpha,mode,over){

  ctx.fillStyle='#1a1d24';const mx=L/2-ws*.55;rr(mx-1.6,-Wd/2-3.2,3.2,3.4,1);ctx.fill();rr(mx-1.6,Wd/2-.2,3.2,3.4,1);ctx.fill();

  ctx.strokeStyle=shade(col,-.45);ctx.lineWidth=1;rr(-L/2+.5,-Wd/2+.5,L-1,Wd-1,r);ctx.stroke();

  const wg=ctx.createLinearGradient(L/2-ws,0,L/2,0);wg.addColorStop(0,'#16233a');wg.addColorStop(1,'#456a92');
  ctx.fillStyle=wg;rr(L/2-ws-1.5,-Wd/2+2.5,ws,Wd-5,r*.7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(L/2-ws*.75,-Wd/2+4);ctx.lineTo(L/2-ws*.3,Wd/2-6);ctx.stroke();
  ctx.fillStyle='#16233a';rr(-L/2+1.5,-Wd/2+4,Math.max(2.5,L*.045),Wd-8,1.5);ctx.fill();

function draw(t){

  if(fillK>0){ctx.strokeStyle=ringMul>1.3&&!danger?'#7fe3ff':danger?`rgba(255,77,94,${.6+.4*Math.sin(t/90)})`:(fillK>.85?'#ffb020':'#ffd23f');ctx.lineWidth=4;ctx.beginPath();ctx.arc(CX,CY,RAD+4.5,-Math.PI/2,-Math.PI/2+fillK*Math.PI*2);ctx.stroke()}

  // particles

  ctx.restore();
}

function callPeople(){
  const need={};bays.forEach(b=>{if(b&&b.state==='bay'&&b.leaveDelay==null)need[b.color]=(need[b.color]||0)+b.cap-b.filled-b.pending});
  pool.forEach(p=>{if(need[p.c]>0)need[p.c]--});
  const front=[],rest=[];for(const p of queue){if(need[p.c]>0){need[p.c]--;front.push(p)}else rest.push(p)}
  if(!front.length)return false;
  // swap: people not needed in the circle walk back out, called people walk in
  const nq=front.concat(rest);if(nq.every((p,i)=>p===queue[i]))return false;queue=nq;
  let out=0;for(let i=pool.length-1;i>=0&&out<front.length;i--){const p=pool[i];if(!bays.some(b=>b&&b.state==='bay'&&b.color===p.c)){pool.splice(i,1);if(p.slot)p.slot.occ=null;queue.push({c:p.c,side:p.x<CX?0:1,v:p.v,ph:p.ph,id:pid++,x:-99,y:-99,d:0,init:false});out++}}
  return true;
}
